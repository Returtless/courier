org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8 -Dorg.sqlite.tmpdir=C:\\Users\\likhachev.vladislav\\courier\\android\\.sqlite-tmp
android.useAndroidX=true
kotlin.code.style=official
org.gradle.java.home=C:\\Program Files\\Android\\Android Studio\\jbr

# Workaround for Windows InvalidPathException caused by filenames
# containing control characters in embedded Python packages.
org.gradle.vfs.watch=false

# Stabilize builds on Windows after repeated failures:
# - avoid daemon state corruption/races
# - avoid parallelism/config cache interactions with KSP/Kotlin daemon
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=false
org.gradle.configuration-cache=false
org.gradle.configureondemand=false
org.gradle.workers.max=1

# Make Kotlin compilation deterministic.
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.enabled=false

# Chaquopy: только arm64-v8a (сборка pip в ~3 раза быстрее). Для эмулятора x86_64 — false или удалите строку.
# Не путать с задачей Gradle: флаг задаётся ТАК (в файле) или в командной строке: -Pcourier.fastAbi=true
courier.fastAbi=true
